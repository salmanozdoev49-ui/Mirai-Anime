<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mirai Anime</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

header {
    height: 65px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0e14;
    border-bottom: 1px solid #20212a;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.header-search {
    font-size: 22px;
    cursor: pointer;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 20px 16px 90px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.hero {
    padding: 28px 20px;
    border-radius: 20px;

    background:
        radial-gradient(
            circle at 90% 10%,
            #3b2368 0,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #171126,
            #0c0d13
        );

    margin-bottom: 30px;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 30px;
}

.hero p {
    color: #aaaab5;
    line-height: 1.5;
    margin: 0 0 20px;
}

.search {
    width: 100%;
    padding: 15px 17px;
    border: 1px solid #292a36;
    outline: none;
    border-radius: 12px;
    background: #20212a;
    color: white;
    font-size: 15px;
}

.search:focus {
    border-color: #8b5cf6;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0 15px;
}

.section-title h2 {
    font-size: 20px;
    margin: 0;
}

.section-title button {
    border: 0;
    background: none;
    color: #9b72ff;
}

.anime-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.anime-card {
    background: #111219;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #1e2029;
    cursor: pointer;
    transition: .2s;
}

.anime-card:hover {
    transform: translateY(-3px);
    border-color: #8b5cf6;
}

.poster {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #191a23;
    display: block;
}

.poster-placeholder {
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;

    background:
        linear-gradient(
            135deg,
            #29203f,
            #15151d
        );
}

.anime-info {
    padding: 11px;
}

.anime-title {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.35;
    margin-bottom: 7px;
}

.anime-meta {
    color: #888995;
    font-size: 12px;
}

.rating {
    color: #ffc857;
}

.progress-container {
    margin-top: 10px;
}

.progress-text {
    color: #92939e;
    font-size: 11px;
    margin-bottom: 5px;
}

.progress-bar {
    width: 100%;
    height: 4px;
    background: #292a35;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #8b5cf6;
    border-radius: 10px;
}

.status-label {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 8px;
    border-radius: 7px;
    font-size: 10px;
    background: #24202f;
    color: #c5a9ff;
}

.back {
    border: 0;
    background: #191a22;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
}

.anime-detail {
    background: #111219;
    border: 1px solid #20212a;
    border-radius: 18px;
    overflow: hidden;
}

.detail-top {
    padding: 20px;
}

.detail-poster {
    width: 150px;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    margin-bottom: 18px;
}

.detail-title {
    font-size: 26px;
    margin: 0 0 10px;
}

.detail-description {
    color: #aaaab5;
    line-height: 1.6;
    font-size: 14px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 15px 0;
}

.tag {
    background: #24202f;
    color: #c5a9ff;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 12px;
}

.status-title {
    font-size: 15px;
    margin-top: 25px;
    margin-bottom: 10px;
}

.status-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.status-btn {
    border: 1px solid #292a35;
    background: #171820;
    color: white;
    padding: 11px 6px;
    border-radius: 9px;
    font-size: 12px;
}

.status-btn.active {
    background: #8b5cf6;
    border-color: #8b5cf6;
}

.favorite-btn {
    border: 0;
    background: #8b5cf6;
    color: white;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: bold;
    margin-top: 12px;
}

.season-title {
    font-size: 19px;
    margin: 25px 0 12px;
}

.season-block {
    margin-bottom: 25px;
}

.episode-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.episode {
    border: 1px solid #292a35;
    background: #171820;
    color: white;
    padding: 12px 5px;
    border-radius: 9px;
}

.episode:hover {
    background: #8b5cf6;
}

.episode.watched {
    border-color: #8b5cf6;
    color: #c5a9ff;
}

.empty {
    text-align: center;
    padding: 40px 15px;
    color: #777985;
    grid-column: 1 / -1;
}

.watch-container {
    width: 100%;
}

.video-box {
    width: 100%;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #252631;
}

.video-box video {
    display: block;
    width: 100%;
    max-height: 70vh;
    background: #000;
}

.watch-title {
    margin: 18px 0 5px;
    font-size: 22px;
}

.watch-episode {
    color: #92939e;
    font-size: 14px;
    margin-bottom: 25px;
}

.watch-section {
    margin-bottom: 22px;
}

.watch-label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.choice-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.choice {
    border: 1px solid #292a35;
    background: #171820;
    color: #fff;
    padding: 11px 15px;
    border-radius: 9px;
}

.choice.active {
    background: #8b5cf6;
    border-color: #8b5cf6;
}

.episode-navigation {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.episode-navigation button {
    flex: 1;
    border: 1px solid #292a35;
    background: #171820;
    color: white;
    padding: 13px 8px;
    border-radius: 10px;
}

.episode-navigation button:hover {
    background: #8b5cf6;
}

.library-tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.library-tab {
    white-space: nowrap;
    border: 1px solid #292a35;
    background: #171820;
    color: #aaaab5;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 12px;
}

.library-tab.active {
    background: #8b5cf6;
    color: white;
    border-color: #8b5cf6;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: #0d0e14;
    border-top: 1px solid #20212a;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 30;
}

.nav-item {
    text-align: center;
    color: #777984;
    font-size: 11px;
    cursor: pointer;
}

.nav-item div {
    font-size: 21px;
    margin-bottom: 3px;
}

.nav-item.active {
    color: #8b5cf6;
}

.loading {
    text-align: center;
    color: #aaa;
    padding: 40px 10px;
    grid-column: 1 / -1;
}

.error-box {
    background: #2a1115;
    border: 1px solid #63232c;
    color: #ffb5bd;
    padding: 20px;
    border-radius: 12px;
    line-height: 1.5;
    grid-column: 1 / -1;
}

@media (min-width: 700px) {

    .anime-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .detail-poster {
        width: 190px;
        height: 280px;
    }

}

@media (max-width: 500px) {

    .episode-list {
        grid-template-columns: repeat(3, 1fr);
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        Mirai <span>Anime</span>
    </div>

    <div
        class="header-search"
        onclick="focusSearch()"
    >
        🔍
    </div>

</header>


<main>

<!-- HOME -->

<section id="homePage" class="page active">

    <section class="hero">

        <h1>Смотри аниме</h1>

        <p>
            Находи любимые тайтлы,
            добавляй их в библиотеку
            и продолжай просмотр.
        </p>

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="🔎 Найти аниме..."
            oninput="searchAnime()"
        >

    </section>

    <div class="section-title">

        <h2>Популярное</h2>

        <button onclick="showPage('catalogPage')">
            Все →
        </button>

    </div>

    <div
        id="popularGrid"
        class="anime-grid"
    ></div>

</section>


<!-- CATALOG -->

<section id="catalogPage" class="page">

    <div class="section-title">

        <h2>Каталог</h2>

    </div>

    <input
        id="catalogSearch"
        class="search"
        type="text"
        placeholder="🔎 Поиск по каталогу..."
        oninput="catalogSearch()"
    >

    <div
        id="catalogGrid"
        class="anime-grid"
        style="margin-top:20px;"
    ></div>

</section>


<!-- LIBRARY -->

<section id="favoritesPage" class="page">

    <div class="section-title">

        <h2>Моя библиотека</h2>

    </div>

    <div class="library-tabs">

        <button
            class="library-tab active"
            onclick="filterLibrary('all', this)"
        >
            ⭐ Все
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('watching', this)"
        >
            👀 Смотрю
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('watched', this)"
        >
            ✅ Просмотрено
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('planned', this)"
        >
            ⏳ Планирую
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('dropped', this)"
        >
            ❌ Бросил
        </button>

    </div>

    <div
        id="favoritesGrid"
        class="anime-grid"
    ></div>

</section>


<!-- ANIME -->

<section id="animePage" class="page">

    <button
        class="back"
        onclick="showPage('catalogPage')"
    >
        ← Назад
    </button>

    <div id="animeDetails"></div>

</section>


<!-- WATCH -->

<section id="watchPage" class="page">

    <button
        class="back"
        onclick="showPage('animePage')"
    >
        ← Назад к аниме
    </button>

    <div class="watch-container">

        <div class="video-box">

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            >
                Ваш браузер не поддерживает видео.
            </video>

        </div>

        <h1
            id="watchTitle"
            class="watch-title"
        >
            Название аниме
        </h1>

        <div
            id="watchEpisode"
            class="watch-episode"
        >
            Серия 1
        </div>

        <div class="watch-section">

            <div class="watch-label">
                Озвучка
            </div>

            <div
                id="dubChoices"
                class="choice-list"
            ></div>

        </div>

        <div class="watch-section">

            <div class="watch-label">
                Качество
            </div>

            <div
                id="qualityChoices"
                class="choice-list"
            ></div>

        </div>

        <div class="episode-navigation">

            <button onclick="previousEpisode()">
                ← Предыдущая
            </button>

            <button onclick="nextEpisode()">
                Следующая →
            </button>

        </div>

    </div>

</section>

</main>


<!-- NAVIGATION -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        onclick="showPage('homePage')"
    >
        <div>🏠</div>
        Главная
    </div>

    <div
        class="nav-item"
        onclick="showPage('catalogPage')"
    >
        <div>📚</div>
        Каталог
    </div>

    <div
        class="nav-item"
        onclick="showPage('favoritesPage')"
    >
        <div>⭐</div>
        Библиотека
    </div>

    <div
        class="nav-item"
        onclick="showPage('homePage')"
    >
        <div>👤</div>
        Профиль
    </div>

</nav>


<script>

/* ==========================================
   НАСТРОЙКА СЕРВЕРА
========================================== */

/*
   СЮДА ВСТАВЬ АДРЕС ТВОЕГО PYTHON-СЕРВЕРА.

   Например:

   https://mirai-anime-api.onrender.com

   ВАЖНО:
   Без / в конце.
*/

const API_URL =
    "https://mirai-anime.onrender.com";


/* ==========================================
   ДАННЫЕ
========================================== */

let animeList = [];

let currentAnime = null;

let currentEpisode = 1;

let currentSeason = 1;

let currentDub = "";

let currentQuality = "720p";

let currentEpisodeData = [];

let favorites =
    JSON.parse(
        localStorage.getItem("miraiFavorites")
    ) || [];

let statuses =
    JSON.parse(
        localStorage.getItem("miraiStatuses")
    ) || {};

let progress =
    JSON.parse(
        localStorage.getItem("miraiProgress")
    ) || {};


/* ==========================================
   API
========================================== */

async function apiFetch(path) {

    const response =
        await fetch(
            API_URL + path
        );

    let data = null;

    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            "Сервер вернул неправильный ответ."
        );

    }

    if (!response.ok) {

        throw new Error(
            data.error ||
            "Ошибка сервера."
        );

    }

    return data;

}


/* ==========================================
   ЗАГРУЗКА АНИМЕ
========================================== */

async function loadAnimeFromServer() {

    const popular =
        document.getElementById(
            "popularGrid"
        );

    const catalog =
        document.getElementById(
            "catalogGrid"
        );

    popular.innerHTML =
        `<div class="loading">
            ⏳ Загружаем каталог...
        </div>`;

    catalog.innerHTML =
        `<div class="loading">
            ⏳ Загружаем каталог...
        </div>`;

    try {

        const result =
            await apiFetch(
                "/api/anime"
            );

        animeList =
            result.anime || [];

        loadAll();

    }

    catch (error) {

        console.error(error);

        showDatabaseError(
            error.message
        );

    }

}


/* ==========================================
   ОШИБКА
========================================== */

function showDatabaseError(
    message
) {

    const html = `

        <div class="error-box">

            ❌ Ошибка подключения

            <br><br>

            ${escapeHTML(message)}

            <br><br>

            Проверь адрес Python-сервера
            в переменной API_URL.

        </div>

    `;

    document.getElementById(
        "popularGrid"
    ).innerHTML = html;

    document.getElementById(
        "catalogGrid"
    ).innerHTML = html;

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ==========================================
   GENRES
========================================== */

function parseGenres(genres) {

    if (Array.isArray(genres)) {
        return genres;
    }

    if (!genres) {
        return [];
    }

    return String(genres)
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

}


/* ==========================================
   CARD
========================================== */

function createCard(anime) {

    const status =
        statuses[anime.id] || "";

    const watchedEpisode =
        progress[anime.id] || 0;

    let progressHTML = "";

    if (
        watchedEpisode > 0 &&
        anime.episodes > 0
    ) {

        const percent =
            Math.min(
                100,
                Math.round(
                    watchedEpisode /
                    anime.episodes *
                    100
                )
            );

        progressHTML = `

            <div class="progress-container">

                <div class="progress-text">

                    Серия
                    ${watchedEpisode}
                    из
                    ${anime.episodes}

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width:${percent}%"
                    ></div>

                </div>

            </div>

        `;

    }

    const statusNames = {

        watching:
            "👀 Смотрю",

        watched:
            "✅ Просмотрено",

        planned:
            "⏳ Планирую",

        dropped:
            "❌ Бросил"

    };

    return `

        <div
            class="anime-card"
            onclick="openAnime(${Number(anime.id)})"
        >

            ${
                anime.poster

                ?

                `
                <img
                    class="poster"
                    src="${escapeHTML(anime.poster)}"
                    alt="${escapeHTML(anime.title)}"
                    loading="lazy"
                >
                `

                :

                `
                <div class="poster-placeholder">
                    🎬
                </div>
                `
            }

            <div class="anime-info">

                <div class="anime-title">

                    ${escapeHTML(anime.title)}

                </div>

                <div class="anime-meta">

                    ${escapeHTML(anime.year)}

                    •

                    ${escapeHTML(anime.episodes)}
                    серий

                    •

                    <span class="rating">

                        ★ ${escapeHTML(anime.rating)}

                    </span>

                </div>

                ${
                    status

                    ?

                    `
                    <span class="status-label">

                        ${
                            statusNames[status] ||
                            escapeHTML(status)
                        }

                    </span>
                    `

                    :

                    ""
                }

                ${progressHTML}

            </div>

        </div>

    `;

}


/* ==========================================
   ПОПУЛЯРНОЕ
========================================== */

function loadPopular() {

    const grid =
        document.getElementById(
            "popularGrid"
        );

    if (!grid) return;

    const popular =
        animeList.filter(
            anime =>
                anime.popular === true
        );

    if (!popular.length) {

        grid.innerHTML = `

            <div class="empty">

                Пока нет популярных аниме.

            </div>

        `;

        return;

    }

    grid.innerHTML =
        popular
            .map(createCard)
            .join("");

}


/* ==========================================
   КАТАЛОГ
========================================== */

function loadCatalog(
    list = animeList
) {

    const grid =
        document.getElementById(
            "catalogGrid"
        );

    if (!grid) return;

    if (!list.length) {

        grid.innerHTML = `

            <div class="empty">

                Ничего не найдено 😔

            </div>

        `;

        return;

    }

    grid.innerHTML =
        list
            .map(createCard)
            .join("");

}


/* ==========================================
   ПОИСК
========================================== */

function searchAnime() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const value =
        input.value
            .toLowerCase()
            .trim();

    if (!value) {

        loadPopular();

        return;

    }

    const results =
        animeList.filter(
            anime =>
                String(anime.title)
                    .toLowerCase()
                    .includes(value)
        );

    const grid =
        document.getElementById(
            "popularGrid"
        );

    if (!results.length) {

        grid.innerHTML = `

            <div class="empty">

                Ничего не найдено 😔

            </div>

        `;

        return;

    }

    grid.innerHTML =
        results
            .map(createCard)
            .join("");

}


/* ==========================================
   ПОИСК КАТАЛОГА
========================================== */

function catalogSearch() {

    const input =
        document.getElementById(
            "catalogSearch"
        );

    const value =
        input.value
            .toLowerCase()
            .trim();

    const results =
        animeList.filter(
            anime =>
                String(anime.title)
                    .toLowerCase()
                    .includes(value)
        );

    loadCatalog(results);

}


/* ==========================================
   ОТКРЫТИЕ АНИМЕ
========================================== */

async function openAnime(id) {

    const anime =
        animeList.find(
            a =>
                Number(a.id) ===
                Number(id)
        );

    if (!anime) return;

    currentAnime =
        anime;

    const favorite =
        favorites.includes(
            Number(anime.id)
        );

    const currentStatus =
        statuses[anime.id] || "";

    document.getElementById(
        "animeDetails"
    ).innerHTML = `

        <div class="anime-detail">

            <div class="detail-top">

                ${
                    anime.poster

                    ?

                    `
                    <img
                        class="detail-poster"
                        src="${escapeHTML(anime.poster)}"
                        alt="${escapeHTML(anime.title)}"
                    >
                    `

                    :

                    `
                    <div class="
                        detail-poster
                        poster-placeholder
                    ">
                        🎬
                    </div>
                    `
                }

                <h1 class="detail-title">

                    ${escapeHTML(anime.title)}

                </h1>

                <div class="anime-meta">

                    ${escapeHTML(anime.year)}

                    •

                    ${escapeHTML(anime.episodes)}
                    серий

                    •

                    <span class="rating">

                        ★ ${escapeHTML(anime.rating)}

                    </span>

                </div>

                <div class="tags">

                    ${
                        parseGenres(anime.genres)
                            .map(
                                genre => `
                                    <span class="tag">
                                        ${escapeHTML(genre)}
                                    </span>
                                `
                            )
                            .join("")
                    }

                </div>

                <p class="detail-description">

                    ${escapeHTML(anime.description)}

                </p>

                <div class="status-title">

                    Статус просмотра

                </div>

                <div class="status-buttons">

                    <button
                        class="status-btn ${
                            currentStatus === "watching"
                            ? "active"
                            : ""
                        }"
                        onclick="
                            setStatus(
                                ${Number(anime.id)},
                                'watching'
                            )
                        "
                    >
                        👀 Смотрю
                    </button>

                    <button
                        class="status-btn ${
                            currentStatus === "watched"
                            ? "active"
                            : ""
                        }"
                        onclick="
                            setStatus(
                                ${Number(anime.id)},
                                'watched'
                            )
                        "
                    >
                        ✅ Просмотрено
                    </button>

                    <button
                        class="status-btn ${
                            currentStatus === "planned"
                            ? "active"
                            : ""
                        }"
                        onclick="
                            setStatus(
                                ${Number(anime.id)},
                                'planned'
                            )
                        "
                    >
                        ⏳ Планирую
                    </button>

                    <button
                        class="status-btn ${
                            currentStatus === "dropped"
                            ? "active"
                            : ""
                        }"
                        onclick="
                            setStatus(
                                ${Number(anime.id)},
                                'dropped'
                            )
                        "
                    >
                        ❌ Бросил
                    </button>

                </div>

                <button
                    class="favorite-btn"
                    onclick="
                        toggleFavorite(
                            ${Number(anime.id)}
                        )
                    "
                >

                    ${
                        favorite
                        ?
                        "★ В избранном"
                        :
                        "☆ Добавить в избранное"
                    }

                </button>

                <div id="episodesContainer">

                    <div class="loading">

                        ⏳ Загружаем серии...

                    </div>

                </div>

            </div>

        </div>

    `;

    showPage("animePage");

    await loadEpisodesForAnime(
        anime.id
    );

}


/* ==========================================
   ЗАГРУЗКА СЕРИЙ
========================================== */

async function loadEpisodesForAnime(
    animeId
) {

    const container =
        document.getElementById(
            "episodesContainer"
        );

    if (!container) return;

    try {

        const result =
            await apiFetch(
                "/api/episodes?anime_id=" +
                encodeURIComponent(animeId)
            );

        currentEpisodeData =
            result.episodes || [];

        renderEpisodes(
            currentEpisodeData
        );

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error-box">

                ❌ Не удалось загрузить серии.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* ==========================================
   ОТОБРАЖЕНИЕ СЕРИЙ
========================================== */

function renderEpisodes(
    episodes
) {

    const container =
        document.getElementById(
            "episodesContainer"
        );

    if (!container) return;

    if (!episodes.length) {

        container.innerHTML = `

            <div class="empty">

                Пока нет добавленных серий.

            </div>

        `;

        return;

    }

    const seasons = {};

    episodes.forEach(
        item => {

            const season =
                Number(item.season) || 1;

            if (!seasons[season]) {

                seasons[season] = [];

            }

            seasons[season].push(item);

        }
    );

    const seasonNumbers =
        Object.keys(seasons)
            .map(Number)
            .sort(
                (a, b) =>
                    a - b
            );

    container.innerHTML =
        seasonNumbers
            .map(
                season => {

                    const seasonEpisodes =
                        seasons[season]
                            .sort(
                                (a, b) =>
                                    Number(a.episode) -
                                    Number(b.episode)
                            );

                    return `

                        <div class="season-block">

                            <h2 class="season-title">

                                Сезон ${season}

                            </h2>

                            <div class="episode-list">

                                ${
                                    seasonEpisodes
                                        .map(
                                            item => {

                                                const watched =
                                                    progress[
                                                        currentAnime.id
                                                    ] >=
                                                    Number(
                                                        item.episode
                                                    );

                                                return `

                                                    <button
                                                        class="
                                                            episode
                                                            ${
                                                                watched
                                                                ?
                                                                "watched"
                                                                :
                                                                ""
                                                            }
                                                        "
                                                        onclick="
                                                            playEpisode(
                                                                ${Number(currentAnime.id)},
                                                                ${Number(item.episode)},
                                                                ${Number(item.season)}
                                                            )
                                                        "
                                                    >

                                                        ${
                                                            watched
                                                            ?
                                                            "✓ "
                                                            :
                                                            ""
                                                        }

                                                        Серия
                                                        ${Number(item.episode)}

                                                    </button>

                                                `;

                                            }
                                        )
                                        .join("")
                                }

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* ==========================================
   СТАТУС
========================================== */

function setStatus(
    id,
    status
) {

    statuses[id] =
        status;

    localStorage.setItem(
        "miraiStatuses",
        JSON.stringify(statuses)
    );

    openAnime(id);

    loadAll();

}


/* ==========================================
   ИЗБРАННОЕ
========================================== */

function toggleFavorite(
    id
) {

    id =
        Number(id);

    if (
        favorites.includes(id)
    ) {

        favorites =
            favorites.filter(
                x =>
                    Number(x) !== id
            );

    }

    else {

        favorites.push(id);

    }

    localStorage.setItem(
        "miraiFavorites",
        JSON.stringify(favorites)
    );

    openAnime(id);

    loadAll();

}


/* ==========================================
   PLAY EPISODE
========================================== */

async function playEpisode(
    animeId,
    episode,
    season
) {

    currentAnime =
        animeList.find(
            anime =>
                Number(anime.id) ===
                Number(animeId)
        );

    if (!currentAnime) return;

    currentEpisode =
        Number(episode);

    currentSeason =
        Number(season) || 1;

    progress[
        currentAnime.id
    ] =
        currentEpisode;

    localStorage.setItem(
        "miraiProgress",
        JSON.stringify(progress)
    );

    if (
        !statuses[currentAnime.id] ||
        statuses[currentAnime.id] === "planned"
    ) {

        statuses[
            currentAnime.id
        ] =
            "watching";

        localStorage.setItem(
            "miraiStatuses",
            JSON.stringify(statuses)
        );

    }

    document.getElementById(
        "watchTitle"
    ).textContent =
        currentAnime.title;

    document.getElementById(
        "watchEpisode"
    ).textContent =
        "Сезон " +
        currentSeason +
        " • Серия " +
        currentEpisode;

    showPage("watchPage");

    await loadEpisodePlayer();

    loadAll();

}


/* ==========================================
   ПОЛУЧИТЬ ДАННЫЕ СЕРИИ
========================================== */

async function loadEpisodePlayer() {

    const player =
        document.getElementById(
            "videoPlayer"
        );

    try {

        const result =
            await apiFetch(
                "/api/episode" +
                "?anime_id=" +
                encodeURIComponent(
                    currentAnime.id
                ) +
                "&season=" +
                encodeURIComponent(
                    currentSeason
                ) +
                "&episode=" +
                encodeURIComponent(
                    currentEpisode
                )
            );

        currentEpisodeData =
            result.episodes || [];

        renderPlayerChoices();

        if (!currentEpisodeData.length) {

            player.removeAttribute(
                "src"
            );

            player.load();

            return;

        }

        const matchingDub =
            currentEpisodeData.find(
                x =>
                    x.dub === currentDub
            );

        if (matchingDub) {

            currentDub =
                matchingDub.dub;

        }

        else {

            currentDub =
                currentEpisodeData[0].dub || "";

        }

        const matchingQuality =
            currentEpisodeData.find(
                x =>
                    x.dub === currentDub &&
                    x.quality === currentQuality
            );

        if (matchingQuality) {

            currentQuality =
                matchingQuality.quality;

        }

        else {

            const availableQuality =
                currentEpisodeData.find(
                    x =>
                        x.dub === currentDub
                );

            currentQuality =
                availableQuality
                ?
                availableQuality.quality
                :
                "";

        }

        updateVideoSource();

    }

    catch (error) {

        console.error(error);

        player.removeAttribute(
            "src"
        );

        player.load();

        document.getElementById(
            "watchEpisode"
        ).textContent =
            "Ошибка загрузки серии: " +
            error.message;

    }

}


/* ==========================================
   ВЫБОРЫ
========================================== */

function renderPlayerChoices() {

    const dubContainer =
        document.getElementById(
            "dubChoices"
        );

    const qualityContainer =
        document.getElementById(
            "qualityChoices"
        );

    const dubs =
        [
            ...new Set(
                currentEpisodeData
                    .map(x => x.dub)
                    .filter(Boolean)
            )
        ];

    const qualities =
        [
            ...new Set(
                currentEpisodeData
                    .map(x => x.quality)
                    .filter(Boolean)
            )
        ];

    dubContainer.innerHTML =
        dubs.length
        ?

        dubs
            .map(
                dub => `

                    <button
                        class="choice ${
                            dub === currentDub
                            ? "active"
                            : ""
                        }"
                        onclick="
                            selectDub(
                                '${escapeJS(dub)}'
                            )
                        "
                    >
                        ${escapeHTML(dub)}
                    </button>

                `
            )
            .join("")

        :

        `<span class="anime-meta">
            Нет доступных озвучек
        </span>`;

    qualityContainer.innerHTML =
        qualities.length
        ?

        qualities
            .map(
                quality => `

                    <button
                        class="choice ${
                            quality === currentQuality
                            ? "active"
                            : ""
                        }"
                        onclick="
                            selectQuality(
                                '${escapeJS(quality)}'
                            )
                        "
                    >
                        ${escapeHTML(quality)}
                    </button>

                `
            )
            .join("")

        :

        `<span class="anime-meta">
            Нет доступного качества
        </span>`;

}


/* ==========================================
   JS ESCAPE
========================================== */

function escapeJS(
    value
) {

    return String(
        value ?? ""
    )
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* ==========================================
   ВЫБОР ОЗВУЧКИ
========================================== */

async function selectDub(
    dub
) {

    currentDub =
        dub;

    renderPlayerChoices();

    updateVideoSource();

}


/* ==========================================
   ВЫБОР КАЧЕСТВА
========================================== */

async function selectQuality(
    quality
) {

    currentQuality =
        quality;

    renderPlayerChoices();

    updateVideoSource();

}


/* ==========================================
   ОБНОВИТЬ VIDEO
========================================== */

function updateVideoSource() {

    const player =
        document.getElementById(
            "videoPlayer"
        );

    const item =
        currentEpisodeData.find(
            x =>
                x.dub === currentDub &&
                x.quality === currentQuality
        );

    if (!item) {

        player.removeAttribute(
            "src"
        );

        player.load();

        document.getElementById(
            "watchEpisode"
        ).textContent =
            "Сезон " +
            currentSeason +
            " • Серия " +
            currentEpisode +
            " • Выбранное качество недоступно";

        return;

    }

    if (!item.video_url) {

        player.removeAttribute(
            "src"
        );

        player.load();

        return;

    }

    player.src =
        item.video_url;

    player.load();

    document.getElementById(
        "watchEpisode"
    ).textContent =
        "Сезон " +
        currentSeason +
        " • Серия " +
        currentEpisode +
        " • " +
        (item.dub || "") +
        " • " +
        (item.quality || "");

}


/* ==========================================
   PREVIOUS
========================================== */

async function previousEpisode() {

    if (!currentAnime) return;

    if (currentEpisode <= 1) return;

    currentEpisode--;

    await playEpisode(
        currentAnime.id,
        currentEpisode,
        currentSeason
    );

}


/* ==========================================
   NEXT
========================================== */

async function nextEpisode() {

    if (!currentAnime) return;

    if (
        currentEpisode >=
        Number(currentAnime.episodes)
    ) {

        return;

    }

    currentEpisode++;

    await playEpisode(
        currentAnime.id,
        currentEpisode,
        currentSeason
    );

}


/* ==========================================
   LIBRARY
========================================== */

function filterLibrary(
    filter,
    button
) {

    if (!button) return;

    document
        .querySelectorAll(
            ".library-tab"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );

    let list = [];

    if (
        filter === "all"
    ) {

        list =
            animeList.filter(
                anime =>
                    favorites.includes(
                        Number(anime.id)
                    )
                    ||
                    statuses[anime.id]
            );

    }

    else {

        list =
            animeList.filter(
                anime =>
                    statuses[anime.id] ===
                    filter
            );

    }

    const grid =
        document.getElementById(
            "favoritesGrid"
        );

    if (!list.length) {

        grid.innerHTML = `

            <div class="empty">

                Здесь пока ничего нет 😔

            </div>

        `;

        return;

    }

    grid.innerHTML =
        list
            .map(createCard)
            .join("");

}


/* ==========================================
   SHOW PAGE
========================================== */

function showPage(
    pageId
) {

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            page =>
                page.classList.remove(
                    "active"
                )
        );

    const page =
        document.getElementById(
            pageId
        );

    if (page) {

        page.classList.add(
            "active"
        );

    }

    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    const navItems =
        document.querySelectorAll(
            ".nav-item"
        );

    if (
        pageId ===
        "homePage"
    ) {

        navItems[0]
            ?.classList.add("active");

    }

    if (
        pageId ===
        "catalogPage"
    ) {

        navItems[1]
            ?.classList.add("active");

        loadCatalog();

    }

    if (
        pageId ===
        "favoritesPage"
    ) {

        navItems[2]
            ?.classList.add("active");

        filterLibrary(
            "all",
            document.querySelector(
                ".library-tab"
            )
        );

    }

    window.scrollTo(
        0,
        0
    );

}


/* ==========================================
   SEARCH BUTTON
========================================== */

function focusSearch() {

    showPage(
        "homePage"
    );

    setTimeout(
        () => {

            const input =
                document.getElementById(
                    "searchInput"
                );

            input?.focus();

        },
        100
    );

}


/* ==========================================
   LOAD ALL
========================================== */

function loadAll() {

    loadPopular();

    loadCatalog();

    const firstTab =
        document.querySelector(
            ".library-tab"
        );

    if (firstTab) {

        filterLibrary(
            "all",
            firstTab
        );

    }

}


/* ==========================================
   START
========================================== */

loadAnimeFromServer();

</script>
