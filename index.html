<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mirai Anime</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

button,
input {
    font-family: inherit;
}

header {
    height: 65px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #0d0e14;
    border-bottom: 1px solid #20212a;

    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.header-search {
    font-size: 22px;
    cursor: pointer;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 20px 16px 90px;
}

.hero {
    padding: 28px 20px;
    border-radius: 20px;

    background:
        radial-gradient(
            circle at 90% 10%,
            #3b2368 0,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #171126,
            #0c0d13
        );

    margin-bottom: 30px;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 30px;
}

.hero p {
    color: #aaaab5;
    line-height: 1.5;
    margin: 0 0 20px;
}

.search {
    width: 100%;
    padding: 15px 17px;

    border: 1px solid #292a36;
    outline: none;
    border-radius: 12px;

    background: #20212a;
    color: white;

    font-size: 15px;
}

.search:focus {
    border-color: #8b5cf6;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 25px 0 15px;
}

.section-title h2 {
    font-size: 20px;
    margin: 0;
}

.section-title button {
    border: 0;
    background: none;
    color: #9b72ff;
    cursor: pointer;
}

.anime-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.anime-card {
    background: #111219;
    border-radius: 15px;
    overflow: hidden;

    border: 1px solid #1e2029;

    cursor: pointer;
    transition: .2s;
}

.anime-card:hover {
    transform: translateY(-3px);
    border-color: #8b5cf6;
}

.poster {
    width: 100%;
    height: 220px;

    object-fit: cover;

    background: #191a23;

    display: block;
}

.poster-placeholder {
    height: 220px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 45px;

    background:
        linear-gradient(
            135deg,
            #29203f,
            #15151d
        );
}

.anime-info {
    padding: 11px;
}

.anime-title {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.35;

    margin-bottom: 7px;
}

.anime-meta {
    color: #888995;
    font-size: 12px;
}

.rating {
    color: #ffc857;
}

.progress-container {
    margin-top: 10px;
}

.progress-text {
    color: #92939e;
    font-size: 11px;
    margin-bottom: 5px;
}

.progress-bar {
    width: 100%;
    height: 4px;

    background: #292a35;
    border-radius: 10px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    background: #8b5cf6;

    border-radius: 10px;
}

.status-label {
    display: inline-block;

    margin-top: 8px;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 10px;

    background: #24202f;
    color: #c5a9ff;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.back {
    border: 0;

    background: #191a22;
    color: white;

    padding: 10px 14px;

    border-radius: 10px;

    cursor: pointer;

    margin-bottom: 18px;
}

.anime-detail {
    background: #111219;

    border: 1px solid #20212a;

    border-radius: 18px;

    overflow: hidden;
}

.detail-top {
    padding: 20px;
}

.detail-poster {
    width: 150px;
    height: 220px;

    object-fit: cover;

    border-radius: 12px;

    display: block;

    margin-bottom: 18px;
}

.detail-title {
    font-size: 26px;

    margin: 0 0 10px;
}

.detail-description {
    color: #aaaab5;

    line-height: 1.6;

    font-size: 14px;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin: 15px 0;
}

.tag {
    background: #24202f;

    color: #c5a9ff;

    padding: 6px 9px;

    border-radius: 8px;

    font-size: 12px;
}

.status-title {
    font-size: 15px;

    margin-top: 25px;
    margin-bottom: 10px;
}

.status-buttons {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 8px;
}

.status-btn {
    border: 1px solid #292a35;

    background: #171820;

    color: white;

    padding: 11px 6px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;
}

.status-btn.active {
    background: #8b5cf6;

    border-color: #8b5cf6;
}

.favorite-btn {
    border: 0;

    background: #8b5cf6;

    color: white;

    padding: 12px 16px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    margin-top: 12px;
}

.season-title {
    font-size: 19px;

    margin: 25px 0 12px;
}

.episode-list {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 8px;
}

.episode {
    border: 1px solid #292a35;

    background: #171820;

    color: white;

    padding: 12px 5px;

    border-radius: 9px;

    cursor: pointer;
}

.episode:hover {
    background: #8b5cf6;
}

.episode.watched {
    border-color: #8b5cf6;

    color: #c5a9ff;
}

.watch-container {
    width: 100%;
}

.video-box {
    width: 100%;

    background: #000;

    border-radius: 14px;

    overflow: hidden;

    border: 1px solid #252631;
}

.video-box video {
    display: block;

    width: 100%;

    max-height: 70vh;

    background: #000;
}

.watch-title {
    margin: 18px 0 5px;

    font-size: 22px;
}

.watch-episode {
    color: #92939e;

    font-size: 14px;

    margin-bottom: 25px;
}

.watch-section {
    margin-bottom: 22px;
}

.watch-label {
    font-size: 14px;

    font-weight: bold;

    margin-bottom: 10px;
}

.choice-list {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.choice {
    border: 1px solid #292a35;

    background: #171820;

    color: #fff;

    padding: 11px 15px;

    border-radius: 9px;

    cursor: pointer;
}

.choice.active {
    background: #8b5cf6;

    border-color: #8b5cf6;
}

.choice.disabled {
    opacity: .35;

    cursor: not-allowed;
}

.player-message {
    padding: 25px;

    text-align: center;

    color: #aaaab5;

    background: #111219;

    border-radius: 14px;
}

.episode-navigation {
    display: flex;

    gap: 10px;

    margin-top: 25px;
}

.episode-navigation button {
    flex: 1;

    border: 1px solid #292a35;

    background: #171820;

    color: white;

    padding: 13px 8px;

    border-radius: 10px;

    cursor: pointer;
}

.episode-navigation button:hover {
    background: #8b5cf6;
}

.episode-navigation button:disabled {
    opacity: .35;

    cursor: not-allowed;
}

.library-tabs {
    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding-bottom: 10px;

    margin-bottom: 15px;
}

.library-tab {
    white-space: nowrap;

    border: 1px solid #292a35;

    background: #171820;

    color: #aaaab5;

    padding: 9px 12px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;
}

.library-tab.active {
    background: #8b5cf6;

    color: white;

    border-color: #8b5cf6;
}

.empty {
    text-align: center;

    padding: 40px 15px;

    color: #777985;
}

.bottom-nav {
    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 65px;

    background: #0d0e14;

    border-top: 1px solid #20212a;

    display: flex;

    justify-content: space-around;

    align-items: center;

    z-index: 30;
}

.nav-item {
    text-align: center;

    color: #777984;

    font-size: 11px;

    cursor: pointer;
}

.nav-item div {
    font-size: 21px;

    margin-bottom: 3px;
}

.nav-item.active {
    color: #8b5cf6;
}

@media (min-width: 700px) {

    .anime-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .detail-poster {
        width: 190px;

        height: 280px;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">
        Mirai <span>Anime</span>
    </div>

    <div
        class="header-search"
        onclick="focusSearch()"
    >
        🔍
    </div>

</header>


<main>


<!-- HOME -->

<section
    id="homePage"
    class="page active"
>

    <section class="hero">

        <h1>
            Смотри аниме
        </h1>

        <p>
            Находи любимые тайтлы,
            добавляй их в свою библиотеку
            и продолжай просмотр.
        </p>

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="🔎  Найти аниме..."
            oninput="searchAnime()"
        >

    </section>


    <div class="section-title">

        <h2>
            Популярное
        </h2>

        <button
            onclick="showPage('catalogPage')"
        >
            Все →
        </button>

    </div>


    <div
        id="popularGrid"
        class="anime-grid"
    ></div>

</section>


<!-- CATALOG -->

<section
    id="catalogPage"
    class="page"
>

    <div class="section-title">

        <h2>
            Каталог
        </h2>

    </div>


    <input
        id="catalogSearch"
        class="search"
        type="text"
        placeholder="🔎  Поиск по каталогу..."
        oninput="catalogSearch()"
    >


    <div
        id="catalogGrid"
        class="anime-grid"
        style="margin-top:20px;"
    ></div>

</section>


<!-- LIBRARY -->

<section
    id="favoritesPage"
    class="page"
>

    <div class="section-title">

        <h2>
            Моя библиотека
        </h2>

    </div>


    <div class="library-tabs">

        <button

            onclick="filterLibrary('all', this)"

            ⭐ Все

            class="library-tab"

        >
            👀 Смотрю
        </button>

        <button

            onclick="filterLibrary('watched', this)"
        >
            ✅ Просмотрено
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('planned', this)"
        >
            ⏳ Планирую
        </button>

        <button
            class="library-tab"
            onclick="filterLibrary('dropped', this)"
        >
            ❌ Бросил
        </button>

    </div>


    <div

        class="anime-grid"

</section>


<!-- ANIME -->

<section
    id="animePage"
    class="page"
>

    <button
        class="back"
        onclick="showPage('homePage')"
    >
        ← Назад
    </button>

        id="animeDetails"
    ></div>

</section>


<!-- WATCH -->

<section
    id="watchPage"
    class="page"
>

    <button
        class="back"
        onclick="showPage('animePage')"
    >
        ← Назад к аниме
    </button>


    <div class="watch-container">


        <div

            class="video-box"
        >

            <video
                id="videoPlayer"

        </div>


        <h1
            id="watchTitle"
            class="watch-title"
        >
            Название аниме
        </h1>


        <div
            id="watchEpisode"
            class="watch-episode"

            Серия 1

        <div class="watch-section">

            <div class="watch-label">
                Озвучка

        <!-- QUALITY -->

        <div class="watch-section">

            <div class="watch-label">

        </div>


        <div class="episode-navigation">

        </div>

    </div>

</section>


</main>


<!-- NAVIGATION -->

<nav class="bottom-nav">


    <div
        class="nav-item active"
        onclick="showPage('homePage')"
    >

        <div>
            🏠
        </div>

        Главная

    </div>


    <div
        class="nav-item"
        onclick="showPage('catalogPage')"
    >

        <div>
            📚
        </div>

        Каталог

    </div>


    <div
        class="nav-item"
        onclick="showPage('favoritesPage')"
    >

        <div>
            ⭐
        </div>

        Библиотека

    </div>


    <div
        class="nav-item"
        onclick="showPage('homePage')"
    >

        <div>
            👤
        </div>

        Профиль

    </div>


</nav>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */


const SUPABASE_URL =
    "https://bugtgzxhteqnihuadpvp.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_pKJuxxiLusgjY_ZpYG7PLw_sRCe_gtA";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DATABASE
===================================================== */


let animeList = [];

let episodeList = [];


/* =====================================================
   LOCAL STORAGE
===================================================== */


let favorites =
    JSON.parse(
        localStorage.getItem(
            "miraiFavorites"
        )
    ) || [];


let statuses =
    JSON.parse(
        localStorage.getItem(
            "miraiStatuses"
        )
    ) || {};


let progress =
    JSON.parse(
        localStorage.getItem(
            "miraiProgress"
        )
    ) || {};


/* =====================================================
   CURRENT STATE
===================================================== */


let currentAnime = null;

let currentEpisode = 1;

let currentDub = "AniLibria";

let currentQuality = "720p";

let currentEpisodes = [];


/* =====================================================
   LOAD ANIME
===================================================== */


async function loadAnimeFromSupabase() {

    try {

        const result =
            await supabaseClient
                .from("Anime sait")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        const data =
            result.data;


        const error =
            result.error;


        if (error) {

            console.error(
                "Anime Supabase error:",
                error
            );

            showDatabaseError(
                error
            );

            return;

        }


        animeList =
            (data || []).map(
                anime => ({

                    id:
                        anime.id,

                    title:
                        anime.title ||
                        "Без названия",

                    year:
                        anime.year ||
                        0,

                    episodes:
                        Number(
                            anime.episodes
                        ) || 0,

                    rating:
                        anime.rating ||
                        0,

                    genres:
                        parseGenres(
                            anime.genres
                        ),

                    description:
                        anime.description ||
                        "",

                    poster:
                        anime.poster ||
                        "",

                    popular:
                        anime.popular === true

                })
            );


        await loadEpisodesFromSupabase();

        loadAll();

    }

    catch (error) {

        console.error(
            error
        );

        showDatabaseError(
            error
        );

    }

}


/* =====================================================
   LOAD EPISODES
===================================================== */


async function loadEpisodesFromSupabase() {

    try {

        const result =
            await supabaseClient
                .from("episodes")
                .select("*")
                .order(
                    "episode",
                    {
                        ascending: true
                    }
                );


        const data =
            result.data;


        const error =
            result.error;


        if (error) {

            console.error(
                "Episodes Supabase error:",
                error
            );

            episodeList = [];

            return;

        }


        episodeList =
            data || [];


        console.log(
            "Episodes loaded:",
            episodeList
        );

    }

    catch (error) {

        console.error(
            error
        );

        episodeList = [];

    }

}


/* =====================================================
   GENRES
===================================================== */


function parseGenres(
    genres
) {

    if (
        Array.isArray(
            genres
        )
    ) {

        return genres;

    }


    if (!genres) {

        return [];

    }


    return String(
        genres
    )
        .split(",")
        .map(
            genre =>
                genre.trim()
        )
        .filter(
            Boolean
        );

}


/* =====================================================
   DATABASE ERROR
===================================================== */


function showDatabaseError(
    error
) {

    const message = `

        <div class="empty">

            ❌ Ошибка Supabase

            <br><br>

            Сайт подключился к Supabase,
            но Supabase вернул ошибку.

            <br><br>

            <small>

                ${escapeHTML(
                    error?.message ||
                    "Неизвестная ошибка"
                )}

            </small>

        </div>

    `;


    const popular =
        document.getElementById(
            "popularGrid"
        );


    const catalog =
        document.getElementById(
            "catalogGrid"
        );


    if (popular) {

        popular.innerHTML =
            message;

    }


    if (catalog) {

        catalog.innerHTML =
            message;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */


function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CARD
===================================================== */


function createCard(
    anime
) {

    const status =
        statuses[
            anime.id
        ] || "";


    const watchedEpisode =
        Number(
            progress[
                anime.id
            ]
        ) || 0;


    let progressHTML = "";


    if (
        watchedEpisode > 0 &&
        anime.episodes > 0
    ) {

        const percent =
            Math.min(
                100,
                Math.round(
                    watchedEpisode /
                    anime.episodes *
                    100
                )
            );


        progressHTML = `

            <div class="progress-container">

                <div class="progress-text">

                    Серия
                    ${watchedEpisode}
                    из
                    ${anime.episodes}

                </div>


                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width:${percent}%"
                    ></div>

                </div>

            </div>

        `;

    }


    const statusNames = {

        watching:
            "👀 Смотрю",

        watched:
            "✅ Просмотрено",

        planned:
            "⏳ Планирую",

        dropped:
            "❌ Бросил"

    };


    return `

        <div
            class="anime-card"
            onclick="openAnime(${Number(
                anime.id
            )})"
        >

            ${
                anime.poster

                ?

                `
                <img
                    class="poster"
                    src="${escapeHTML(
                        anime.poster
                    )}"
                    alt="${escapeHTML(
                        anime.title
                    )}"
                >
                `

                :

                `
                <div class="poster-placeholder">
                    🎬
                </div>
                `
            }


            <div class="anime-info">

                <div class="anime-title">

                    ${escapeHTML(
                        anime.title
                    )}

                </div>


                <div class="anime-meta">

                    ${anime.year}

                    •

                    ${anime.episodes}
                    серий

                    •

                    <span class="rating">

                        ★ ${anime.rating}

                    </span>

                </div>


                ${
                    status

                    ?

                    `
                    <span class="status-label">

                        ${
                            statusNames[
                                status
                            ] || status
                        }

                    </span>
                    `

                    :

                    ""
                }


                ${progressHTML}

            </div>

        </div>

    `;

}


/* =====================================================
   POPULAR
===================================================== */


function loadPopular() {

    const grid =
        document.getElementById(
            "popularGrid"
        );


    if (!grid) return;


    const popular =
        animeList.filter(
            anime =>
                anime.popular
        );


    if (!popular.length) {

        grid.innerHTML = `

            <div class="empty">

                Пока нет популярных аниме.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        popular
            .map(
                createCard
            )
            .join("");

}


/* =====================================================
   CATALOG
===================================================== */


function loadCatalog(
    list = animeList
) {

    const grid =
        document.getElementById(
            "catalogGrid"
        );


    if (!grid) return;


    if (!list.length) {

        grid.innerHTML = `

            <div class="empty">

                Ничего не найдено 😔

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list
            .map(
                createCard
            )
            .join("");

}


/* =====================================================
   HOME SEARCH
===================================================== */


function searchAnime() {

    const input =
        document.getElementById(
            "searchInput"
        );


    if (!input) return;


    const value =
        input.value
            .toLowerCase()
            .trim();


    if (!value) {

        loadPopular();

        return;

    }


    const results =
        animeList.filter(
            anime =>
                anime.title
                    .toLowerCase()
                    .includes(
                        value
                    )
        );


    const grid =
        document.getElementById(
            "popularGrid"
        );


    if (!results.length) {

        grid.innerHTML = `

            <div class="empty">

                Ничего не найдено 😔

            </div>

        `;

        return;

    }


    grid.innerHTML =
        results
            .map(
                createCard
            )
            .join("");

}


/* =====================================================
   CATALOG SEARCH
===================================================== */


function catalogSearch() {

    const input =
        document.getElementById(
            "catalogSearch"
        );


    if (!input) return;


    const value =
        input.value
            .toLowerCase()
            .trim();


    const results =
        animeList.filter(
            anime =>
                anime.title
                    .toLowerCase()
                    .includes(
                        value
                    )
        );


    loadCatalog(
        results
    );

}


/* =====================================================
   OPEN ANIME
===================================================== */


function openAnime(
    id
) {

    const anime =
        animeList.find(
            a =>
                Number(a.id) ===
                Number(id)
        );


    if (!anime) return;


    currentAnime =
        anime;


    const favorite =
        favorites.includes(
            Number(anime.id)
        );


    const currentStatus =
        statuses[
            anime.id
        ] || "";


    const animeEpisodes =
        episodeList.filter(
            ep =>
                Number(ep.anime_id) ===
                Number(anime.id)
        );


    let seasons = [];


    animeEpisodes.forEach(
        ep => {

            const season =
                Number(
                    ep.season
                ) || 1;


            if (
                !seasons.includes(
                    season
                )
            ) {

                seasons.push(
                    season
                );

            }

        }
    );


    if (!seasons.length) {

        seasons = [1];

    }


    seasons.sort(
        (a, b) =>
            a - b
    );


    let seasonsHTML = "";


    seasons.forEach(
        season => {

            const seasonEpisodes =
                animeEpisodes.filter(
                    ep =>
                        Number(
                            ep.season
                        ) ===
                        Number(
                            season
                        )
                );


            seasonEpisodes.sort(
                (a, b) =>
                    Number(a.episode) -
                    Number(b.episode)
            );


            seasonsHTML += `

                <h2 class="season-title">

                    Сезон ${season}

                </h2>


                <div class="episode-list">

            `;


            if (
                seasonEpisodes.length
            ) {

                seasonEpisodes.forEach(
                    ep => {

                        const epNumber =
                            Number(
                                ep.episode
                            );


                        const watched =
                            Number(
                                progress[
                                    anime.id
                                ]
                            ) >=
                            epNumber;


                        seasonsHTML += `

                            <button
                                class="
                                    episode
                                    ${
                                        watched
                                        ? "watched"
                                        : ""
                                    }
                                "
                                onclick="
                                    playEpisode(
                                        ${Number(
                                            anime.id
                                        )},
                                        ${epNumber},
                                        ${Number(
                                            season
                                        )}
                                    )
                                "
                            >

                                ${
                                    watched
                                    ? "✓ "
                                    : ""
                                }

                                Серия
                                ${epNumber}

                            </button>

                        `;

                    }
                );

            }

            else {

                seasonsHTML += `

                    <div class="empty">

                        В этом сезоне пока нет серий.

                    </div>

                `;

            }


            seasonsHTML += `

                </div>

            `;

        }
    );


    document
        .getElementById(
            "animeDetails"
        )
        .innerHTML = `

        <div class="anime-detail">

            <div class="detail-top">


                ${
                    anime.poster

                    ?

                    `
                    <img
                        class="detail-poster"
                        src="${escapeHTML(
                            anime.poster
                        )}"
                        alt="${escapeHTML(
                            anime.title
                        )}"
                    >
                    `

                    :

                    `
                    <div
                        class="
                            detail-poster
                            poster-placeholder
                        "
                    >
                        🎬
                    </div>
                    `
                }


                <h1 class="detail-title">

                    ${escapeHTML(
                        anime.title
                    )}

                </h1>


                <div class="anime-meta">

                    ${anime.year}

                    •

                    ${anime.episodes}
                    серий

                    •

                    <span class="rating">

                        ★ ${anime.rating}

                    </span>

                </div>


                <div class="tags">

                    ${
                        anime.genres
                            .map(
                                genre => `

                                    <span class="tag">

                                        ${escapeHTML(
                                            genre
                                        )}

                                    </span>

                                `
                            )
                            .join("")
                    }

                </div>


                <p class="detail-description">

                    ${escapeHTML(
                        anime.description
                    )}

                </p>


                <div class="status-title">

                    Статус просмотра

                </div>


                <div class="status-buttons">


                    <button
                        class="
                            status-btn
                            ${
                                currentStatus ===
                                "watching"
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            setStatus(
                                ${Number(
                                    anime.id
                                )},
                                'watching'
                            )
                        "
                    >

                        👀 Смотрю

                    </button>


                    <button
                        class="
                            status-btn
                            ${
                                currentStatus ===
                                "watched"
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            setStatus(
                                ${Number(
                                    anime.id
                                )},
                                'watched'
                            )
                        "
                    >

                        ✅ Просмотрено

                    </button>


                    <button
                        class="
                            status-btn
                            ${
                                currentStatus ===
                                "planned"
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            setStatus(
                                ${Number(
                                    anime.id
                                )},
                                'planned'
                            )
                        "
                    >

                        ⏳ Планирую

                    </button>


                    <button
                        class="
                            status-btn
                            ${
                                currentStatus ===
                                "dropped"
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            setStatus(
                                ${Number(
                                    anime.id
                                )},
                                'dropped'
                            )
                        "
                    >

                        ❌ Бросил

                    </button>


                </div>


                <button
                    class="favorite-btn"
                    onclick="
                        toggleFavorite(
                            ${Number(
                                anime.id
                            )}
                        )
                    "
                >

                    ${
                        favorite
                        ?
                        "★ В избранном"
                        :
                        "☆ Добавить в избранное"
                    }

                </button>


                ${
                    progress[
                        anime.id
                    ]

                    ?

                    `

                    <div
                        class="progress-container"
                        style="margin-top:20px;"
                    >

                        <div class="progress-text">

                            Ты посмотрел:

                            ${
                                progress[
                                    anime.id
                                ]
                            }

                            из

                            ${anime.episodes}

                            серий

                        </div>


                        <div class="progress-bar">

                            <div
                                class="progress-fill"
                                style="
                                    width:
                                    ${
                                        anime.episodes

                                        ?

                                        Math.min(
                                            100,
                                            Math.round(
                                                progress[
                                                    anime.id
                                                ] /
                                                anime.episodes *
                                                100
                                            )
                                        )

                                        :

                                        0
                                    }%;
                                "
                            ></div>

                        </div>

                    </div>

                    `

                    :

                    ""
                }


                ${seasonsHTML}


            </div>

        </div>

    `;


    showPage(
        "animePage"
    );

}


/* =====================================================
   STATUS
===================================================== */


function setStatus(
    id,
    status
) {

    statuses[
        id
    ] =
        status;


    localStorage.setItem(
        "miraiStatuses",
        JSON.stringify(
            statuses
        )
    );


    openAnime(
        id
    );


    loadAll();

}


/* =====================================================
   LIBRARY
===================================================== */


function filterLibrary(
    filter,
    button
) {

    if (!button) return;


    document
        .querySelectorAll(
            ".library-tab"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    let list = [];


    if (
        filter === "all"
    ) {

        list =
            animeList.filter(
                anime =>
                    favorites.includes(
                        Number(
                            anime.id
                        )
                    )
                    ||
                    statuses[
                        anime.id
                    ]
            );

    }

    else {

        list =
            animeList.filter(
                anime =>
                    statuses[
                        anime.id
                    ] ===
                    filter
            );

    }


    const grid =
        document.getElementById(
            "favoritesGrid"
        );


    if (!list.length) {

        grid.innerHTML = `

            <div class="empty">

                Здесь пока ничего нет 😔

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list
            .map(
                createCard
            )
            .join("");

}


/* =====================================================
   FAVORITE
===================================================== */


function toggleFavorite(
    id
) {

    id =
        Number(id);


    if (
        favorites.includes(
            id
        )
    ) {

        favorites =
            favorites.filter(
                x =>
                    Number(x) !==
                    id
            );

    }

    else {

        favorites.push(
            id
        );

    }


    localStorage.setItem(
        "miraiFavorites",
        JSON.stringify(
            favorites
        )
    );


    openAnime(
        id
    );


    loadAll();

}


/* =====================================================
   GET EPISODES FOR CURRENT ANIME
===================================================== */


function getEpisodesForAnime(
    animeId
) {

    return episodeList
        .filter(
            ep =>
                Number(
                    ep.anime_id
                ) ===
                Number(
                    animeId
                )
        )
        .sort(
            (a, b) => {

                const seasonA =
                    Number(
                        a.season
                    ) || 1;

                const seasonB =
                    Number(
                        b.season
                    ) || 1;

                if (
                    seasonA !==
                    seasonB
                ) {

                    return (
                        seasonA -
                        seasonB
                    );

                }

                return (
                    Number(
                        a.episode
                    ) -
                    Number(
                        b.episode
                    )
                );

            }
        );

}


/* =====================================================
   PLAY EPISODE
===================================================== */


function playEpisode(
    animeId,
    episode,
    season = 1
) {

    currentAnime =
        animeList.find(
            anime =>
                Number(
                    anime.id
                ) ===
                Number(
                    animeId
                )
        );


    if (!currentAnime) {

        return;

    }


    currentEpisode =
        Number(
            episode
        );


    currentEpisodes =
        getEpisodesForAnime(
            animeId
        );


    const episodeExists =
        currentEpisodes.some(
            ep =>
                Number(
                    ep.season
                ) ===
                Number(
                    season
                )
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    episode
                )
        );


    if (!episodeExists) {

        alert(
            "Эта серия пока не добавлена в Supabase."
        );

        return;

    }


    progress[
        currentAnime.id
    ] =
        currentEpisode;


    localStorage.setItem(
        "miraiProgress",
        JSON.stringify(
            progress
        )
    );


    if (
        !statuses[
            currentAnime.id
        ]
        ||
        statuses[
            currentAnime.id
        ] ===
        "planned"
    ) {

        statuses[
            currentAnime.id
        ] =
            "watching";


        localStorage.setItem(
            "miraiStatuses",
            JSON.stringify(
                statuses
            )
        );

    }


    document
        .getElementById(
            "watchTitle"
        )
        .textContent =
        currentAnime.title;


    document
        .getElementById(
            "watchEpisode"
        )
        .textContent =
        `Сезон ${season} • Серия ${episode}`;


    showPage(
        "watchPage"
    );


    renderWatchChoices(
        season,
        episode
    );


    updateNavigationButtons(
        season,
        episode
    );


    loadVideo(
        season,
        episode
    );


    loadAll();

}


/* =====================================================
   RENDER DUB / QUALITY
===================================================== */


function renderWatchChoices(
    season,
    episode
) {

    const matching =
        currentEpisodes.filter(
            ep =>
                Number(
                    ep.season
                ) ===
                Number(
                    season
                )
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    episode
                )
        );


    const dubs = [];


    matching.forEach(
        ep => {

            const dub =
                ep.dub ||
                "Без озвучки";


            if (
                !dubs.includes(
                    dub
                )
            ) {

                dubs.push(
                    dub
                );

            }

        }
    );


    if (!dubs.length) {

        dubs.push(
            "AniLibria"
        );

    }


    if (
        !dubs.includes(
            currentDub
        )
    ) {

        currentDub =
            dubs[0];

    }


    const dubContainer =
        document.getElementById(
            "dubChoices"
        );


    dubContainer.innerHTML =
        dubs
            .map(
                dub => `

                    <button
                        class="
                            choice
                            ${
                                dub ===
                                currentDub
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            selectDub(
                                '${escapeJS(
                                    dub
                                )}'
                            )
                        "
                    >

                        ${escapeHTML(
                            dub
                        )}

                    </button>

                `
            )
            .join("");


    const qualities = [];


    matching
        .filter(
            ep =>
                String(
                    ep.dub ||
                    ""
                ) ===
                String(
                    currentDub
                )
        )
        .forEach(
            ep => {

                const quality =
                    ep.quality ||
                    "720p";


                if (
                    !qualities.includes(
                        quality
                    )
                ) {

                    qualities.push(
                        quality
                    );

                }

            }
        );


    qualities.sort(
        (a, b) =>
            parseInt(b) -
            parseInt(a)
    );


    if (!qualities.length) {

        qualities.push(
            "720p"
        );

    }


    if (
        !qualities.includes(
            currentQuality
        )
    ) {

        currentQuality =
            qualities[0];

    }


    const qualityContainer =
        document.getElementById(
            "qualityChoices"
        );


    qualityContainer.innerHTML =
        qualities
            .map(
                quality => `

                    <button
                        class="
                            choice
                            ${
                                quality ===
                                currentQuality
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            selectQuality(
                                '${escapeJS(
                                    quality
                                )}'
                            )
                        "
                    >

                        ${escapeHTML(
                            quality
                        )}

                    </button>

                `
            )
            .join("");

}


/* =====================================================
   ESCAPE JS
===================================================== */


function escapeJS(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}


/* =====================================================
   LOAD VIDEO
===================================================== */


function loadVideo(
    season,
    episode
) {

    const playerContainer =
        document.getElementById(
            "playerContainer"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    const found =
        currentEpisodes.find(
            ep =>
                Number(
                    ep.season
                ) ===
                Number(
                    season
                )
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    episode
                )
                &&
                String(
                    ep.dub ||
                    ""
                ) ===
                String(
                    currentDub
                )
                &&
                String(
                    ep.quality ||
                    ""
                ) ===
                String(
                    currentQuality
                )
        );


    if (
        !found ||
        !found.video_url
    ) {

        player.pause();

        player.removeAttribute(
            "src"
        );

        player.load();


        playerContainer.innerHTML = `

            <div class="player-message">

                🎬 Видео для выбранных
                параметров пока не найдено.

                <br><br>

                Озвучка:
                <b>
                    ${escapeHTML(
                        currentDub
                    )}
                </b>

                <br>

                Качество:
                <b>
                    ${escapeHTML(
                        currentQuality
                    )}
                </b>

            </div>

        `;

        return;

    }


    playerContainer.innerHTML = `

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
        ></video>

    `;


    const newPlayer =
        document.getElementById(
            "videoPlayer"
        );


    newPlayer.src =
        found.video_url;


    newPlayer.load();


    newPlayer.onerror =
        function() {

            console.error(
                "Video loading error:",
                found.video_url
            );

        };

}


/* =====================================================
   SELECT DUB
===================================================== */


function selectDub(
    dub
) {

    currentDub =
        dub;


    renderWatchChoices(
        getCurrentSeason(),
        currentEpisode
    );


    loadVideo(
        getCurrentSeason(),
        currentEpisode
    );

}


/* =====================================================
   SELECT QUALITY
===================================================== */


function selectQuality(
    quality
) {

    currentQuality =
        quality;


    renderWatchChoices(
        getCurrentSeason(),
        currentEpisode
    );


    loadVideo(
        getCurrentSeason(),
        currentEpisode
    );

}


/* =====================================================
   CURRENT SEASON
===================================================== */


function getCurrentSeason() {

    const found =
        currentEpisodes.find(
            ep =>
                Number(
                    ep.episode
                ) ===
                Number(
                    currentEpisode
                )
        );


    if (!found) {

        return 1;

    }


    return Number(
        found.season
    ) || 1;

}


/* =====================================================
   PREVIOUS EPISODE
===================================================== */


function previousEpisode() {

    if (
        !currentAnime
    ) return;


    const index =
        currentEpisodes.findIndex(
            ep =>
                Number(
                    ep.season
                ) ===
                getCurrentSeason()
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    currentEpisode
                )
        );


    if (
        index <= 0
    ) {

        return;

    }


    const previous =
        currentEpisodes[
            index - 1
        ];


    playEpisode(
        currentAnime.id,
        Number(
            previous.episode
        ),
        Number(
            previous.season
        )
    );

}


/* =====================================================
   NEXT EPISODE
===================================================== */


function nextEpisode() {

    if (
        !currentAnime
    ) return;


    const index =
        currentEpisodes.findIndex(
            ep =>
                Number(
                    ep.season
                ) ===
                getCurrentSeason()
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    currentEpisode
                )
        );


    if (
        index < 0 ||
        index >=
        currentEpisodes.length - 1
    ) {

        return;

    }


    const next =
        currentEpisodes[
            index + 1
        ];


    playEpisode(
        currentAnime.id,
        Number(
            next.episode
        ),
        Number(
            next.season
        )
    );

}


/* =====================================================
   NAVIGATION BUTTONS
===================================================== */


function updateNavigationButtons(
    season,
    episode
) {

    const index =
        currentEpisodes.findIndex(
            ep =>
                Number(
                    ep.season
                ) ===
                Number(
                    season
                )
                &&
                Number(
                    ep.episode
                ) ===
                Number(
                    episode
                )
        );


    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    if (!previous || !next) {

        return;

    }


    previous.disabled =
        index <= 0;


    next.disabled =
        index < 0 ||
        index >=
        currentEpisodes.length - 1;

}


/* =====================================================
   SHOW PAGE
===================================================== */


function showPage(
    pageId
) {

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            page =>
                page.classList.remove(
                    "active"
                )
        );


    const page =
        document.getElementById(
            pageId
        );


    if (page) {

        page.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    if (
        pageId ===
        "homePage"
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )[0]
            .classList.add(
                "active"
            );

    }


    if (
        pageId ===
        "catalogPage"
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )[1]
            .classList.add(
                "active"
            );


        loadCatalog();

    }


    if (
        pageId ===
        "favoritesPage"
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )[2]
            .classList.add(
                "active"
            );


        filterLibrary(
            "all",
            document.querySelector(
                ".library-tab"
            )
        );

    }


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   SEARCH BUTTON
===================================================== */


function focusSearch() {

    showPage(
        "homePage"
    );


    setTimeout(
        () => {

            const input =
                document.getElementById(
                    "searchInput"
                );


            if (input) {

                input.focus();

            }

        },
        100
    );

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */


function loadAll() {

    loadPopular();

    loadCatalog();


    const firstTab =
        document.querySelector(
            ".library-tab"
        );


    if (firstTab) {

        filterLibrary(
            "all",
            firstTab
        );

    }

}


/* =====================================================
   START
===================================================== */


loadAnimeFromSupabase();


</script>
